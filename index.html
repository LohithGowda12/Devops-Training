
<style>
    /* THEME COLORS */
    :root {
        --bg-main: #0b1020;
        --bg-section: #070b16;
        --bg-card: #111a2e;
        --bg-hover: #18243a;

        --primary: #2dd4bf;
        --secondary: #a78bfa;
        --button: #7c3aed;

        --text-main: #ffffff;
        --text-muted: #9aa9c2;
        --border: #2b3650;
        --success: #34d399;
    }

    /* GLOBAL */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: Arial, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
    }

    /* NAVBAR */
    nav {
        min-height: 70px;
        padding: 18px 8%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--bg-card);
        border-bottom: 1px solid var(--border);
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        color: var(--primary);
    }

    .logo span {
        color: var(--secondary);
    }

    nav ul {
        display: flex;
        flex-wrap: wrap;
        gap: 25px;
        list-style: none;
    }

    nav a {
        color: var(--text-muted);
        text-decoration: none;
        transition: color 0.3s;
    }

    nav a:hover {
        color: var(--primary);
    }

    /* HERO */
    .hero {
        min-height: 70vh;
        padding: 60px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        background: radial-gradient(
            circle at top,
            #312e81,
            var(--bg-main) 65%
        );
    }

    .hero-content {
        max-width: 850px;
    }

    .badge {
        display: inline-block;
        padding: 9px 18px;
        margin-bottom: 25px;
        border: 1px solid var(--primary);
        border-radius: 30px;
        color: var(--primary);
        background: var(--bg-hover);
    }

    .hero h1 {
        font-size: clamp(38px, 6vw, 60px);
        margin-bottom: 20px;
    }

    .hero h1 span {
        color: var(--primary);
    }

    .hero p {
        color: var(--text-muted);
        font-size: 19px;
        line-height: 1.7;
        margin-bottom: 30px;
    }

    /* BUTTONS */
    .buttons {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    .btn {
        display: inline-block;
        padding: 14px 26px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
    }

    .primary {
        background: var(--button);
        color: var(--text-main);
    }

    .primary:hover {
        filter: brightness(1.15);
        transform: translateY(-2px);
    }

    .secondary {
        color: var(--text-main);
        border: 1px solid var(--border);
    }

    .secondary:hover {
        background: var(--bg-hover);
    }

    /* SECTIONS */
    .services,
    .jenkins {
        background: var(--bg-section);
    }

    .services,
    .pipeline {
        padding: 70px 8%;
        text-align: center;
    }

    .services h2,
    .pipeline h2 {
        font-size: 34px;
        margin-bottom: 35px;
    }

    /* SERVICE CARDS */
    .cards {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 25px;
    }

    .card {
        width: 280px;
        padding: 30px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-7px);
        border-color: var(--primary);
    }

    .icon {
        font-size: 40px;
        margin-bottom: 15px;
    }

    .card h3,
    .stage h3 {
        color: var(--primary);
        margin-bottom: 12px;
    }

    .card p,
    .stage p {
        color: var(--text-muted);
        line-height: 1.6;
    }

    /* PIPELINE */
    .pipeline-description {
        color: var(--text-muted);
        margin-bottom: 35px;
    }

    .pipeline-container {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    .stage {
        width: 180px;
        padding: 25px 18px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        transition: 0.3s;
    }

    .stage:hover {
        border-color: var(--secondary);
        transform: translateY(-5px);
    }

    .stage-icon {
        font-size: 35px;
        margin-bottom: 12px;
    }

    .stage h3 {
        margin-bottom: 8px;
    }

    .stage p {
        font-size: 14px;
    }

    .arrow {
        color: var(--secondary);
        font-size: 28px;
    }

    /* JENKINS BUILD */
    .jenkins {
        padding: 60px 20px;
        text-align: center;
    }

    .jenkins-box {
        max-width: 650px;
        margin: auto;
        padding: 30px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
    }

    .jenkins-box h2 {
        color: var(--secondary);
        margin-bottom: 20px;
    }

    .build-status {
        color: var(--success);
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .build-info {
        color: var(--text-muted);
        line-height: 2;
    }

    /* SERVER STATUS */
    .status {
        padding: 60px 20px;
        text-align: center;
    }

    .status-box {
        max-width: 500px;
        margin: auto;
        padding: 30px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
    }

    .status-box h2 {
        color: var(--primary);
        margin-bottom: 20px;
    }

    .online {
        color: var(--success);
        font-weight: bold;
        margin-top: 10px;
    }

    /* FOOTER */
    footer {
        padding: 25px;
        text-align: center;
        color: var(--text-muted);
        background: var(--bg-section);
        border-top: 1px solid var(--border);
    }

    /* MOBILE */
    @media (max-width: 720px) {
        nav {
            flex-direction: column;
            align-items: flex-start;
            gap: 18px;
        }

        nav ul {
            gap: 14px;
        }

        .hero p {
            font-size: 16px;
        }

        .pipeline-container {
            flex-direction: column;
        }

        .stage {
            width: min(100%, 280px);
        }

        .arrow {
            transform: rotate(90deg);
        }
    }
</style>
